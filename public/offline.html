<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>인터넷 연결 확인 | 참오트케어</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f1e4; color: #3b2a20;
         font-family: -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Malgun Gothic", sans-serif; text-align: center; }
  main { padding: 2rem 1.5rem; max-width: 22rem; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
  p { margin: 0 0 1.4rem; color: #6a5848; line-height: 1.6; }
  button { padding: 0.85rem 1.6rem; border: 0; border-radius: 999px; background: #7a2331; color: #fff; font: inherit; font-weight: 800; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1>인터넷에 연결되지 않았어요</h1>
  <p>와이파이나 데이터 연결을 확인한 뒤 다시 시도해 주세요.</p>
  <button type="button" onclick="location.reload()">다시 시도</button>
</main>
</body>
</html>
